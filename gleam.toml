name = "packkit"
version = "0.5.0"
description = "Compression and archive formats (gzip, zstd, xz, tar, zip, 7z and more) in pure Gleam for Erlang and JavaScript"
licences = ["MIT"]
repository = { type = "github", user = "nao1215", repo = "packkit" }
links = [
  { title = "Repository", href = "https://github.com/nao1215/packkit" },
  { title = "Documentation", href = "https://hexdocs.pm/packkit" },
  { title = "Changelog", href = "https://github.com/nao1215/packkit/blob/main/CHANGELOG.md" },
]
internal_modules = [
  "packkit/internal",
  "packkit/internal/*",
]
gleam = ">= 1.14.0"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
glinter = ">= 2.14.0 and < 3.0.0"
metamon = ">= 0.8.0 and < 2.0.0"

[tools.glinter]
warnings_as_errors = true
include = ["src/", "test/"]

[tools.glinter.rules]
label_possible = "off"
unused_exports = "off"

[tools.glinter.ignore]
"test/**/*.gleam" = [
  "assert_ok_pattern",
  "missing_type_annotation",
  "prefer_guard_clause",
  "short_variable_name",
  "unused_exports",
]
"test/packkit/*_fuzz_test.gleam" = ["discarded_result"]
"src/packkit/internal/ar.gleam" = [
  "assert_ok_pattern",
  "deep_nesting",
  "prefer_guard_clause",
]
"src/packkit/internal/cpio.gleam" = [
  "assert_ok_pattern",
  "prefer_guard_clause",
]
"src/packkit/internal/bzip2.gleam" = [
  "assert_ok_pattern",
  "deep_nesting",
  "discarded_result",
  "prefer_guard_clause",
  "short_variable_name",
  "thrown_away_error",
]
"src/packkit/internal/brotli.gleam" = [
  "assert_ok_pattern",
  "prefer_guard_clause",
  "thrown_away_error",
]
"src/packkit/internal/checksum.gleam" = ["short_variable_name"]
"src/packkit/internal/deflate.gleam" = [
  "assert_ok_pattern",
  "deep_nesting",
  "discarded_result",
